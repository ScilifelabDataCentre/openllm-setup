# Dev: Open WebUI at https://openllm.scilifelab-2-dev.sys.kth.se (develop branch, values-dev.yaml).
# Deploy: kubectl apply -k search-gateway-kth-cluster-k8s/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openllm  # the namespace Open WebUI runs in
resources:
  - ../base
images:
  - name: ghcr.io/scilifelabdatacentre/openllm-search-gateway
    newTag: "1.0.0"
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: search-gateway
      spec:
        template:
          spec:
            containers:
              - name: search-gateway
                env:
                  - name: OPENWEBUI_URL
                    value: "https://openllm.scilifelab-2-dev.sys.kth.se"
                  # DuckDuckGo refuses searches from this cluster's address (Oct 2026), Bing answers.
                  # Bing means Microsoft receives the approved search text. Remove these two lines
                  # to go back to the default from base/ (duckduckgo).
                  - name: SEARCH_ENGINE
                    value: "bing"
