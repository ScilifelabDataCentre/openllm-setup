# Who may talk to the search gateway, and where it may go.
# In: only pods in the openllm namespace (Open WebUI), on port 8000.
# Out: DNS, and HTTPS to the internet (DuckDuckGo). Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-gateway
  namespace: openllm
  labels:
    app: search-gateway
spec:
  podSelector:
    matchLabels:
      app: search-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}  # any pod in this namespace
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - ports:  # DNS, to look up duckduckgo.com
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:  # HTTPS to the search engine
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 443
