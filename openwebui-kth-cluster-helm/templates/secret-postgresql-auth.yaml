{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.createSecret) (or .Values.postgresql.auth.password .Values.postgresql.auth.postgresPassword) }}
{{- fail "postgresql.auth.password/postgresPassword were provided but postgresql.auth.createSecret=false. Manage the existing PostgreSQL Secret outside this chart, or set createSecret=true only for first-time bootstrap before the PostgreSQL data volume is initialized." }}
{{- end }}
{{- if and .Values.postgresql.enabled .Values.postgresql.auth.createSecret }}
{{- $namespace := include "openwebui-kth-cluster-helm.namespace" . -}}
{{- $secretName := include "openwebui-kth-cluster-helm.postgresqlSecretName" . -}}
{{- $userPasswordKey := default "password" .Values.postgresql.auth.secretKeys.userPasswordKey -}}
{{- $adminPasswordKey := default "postgres-password" .Values.postgresql.auth.secretKeys.adminPasswordKey -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "openwebui-kth-cluster-helm.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
data:
  {{ $userPasswordKey }}: {{ required "postgresql.auth.password is required when this chart creates postgresql.auth.existingSecret" .Values.postgresql.auth.password | b64enc | quote }}
  {{- if ne .Values.postgresql.auth.enablePostgresUser false }}
  {{ $adminPasswordKey }}: {{ required "postgresql.auth.postgresPassword is required when this chart creates postgresql.auth.existingSecret and postgresql.auth.enablePostgresUser is not false" .Values.postgresql.auth.postgresPassword | b64enc | quote }}
  {{- end }}
{{- end }}
