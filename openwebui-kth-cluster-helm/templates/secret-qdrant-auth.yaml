{{- if and (eq .Values.vectorDatabase.type "qdrant") .Values.vectorDatabase.qdrant.auth.enabled (not .Values.vectorDatabase.qdrant.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openwebui-kth-cluster-helm.qdrantSecretName" . }}
  namespace: {{ include "openwebui-kth-cluster-helm.namespace" . }}
  labels:
    {{- include "openwebui-kth-cluster-helm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "openwebui-kth-cluster-helm.qdrantSecretKey" . }}: {{ include "openwebui-kth-cluster-helm.qdrantApiKeyValue" . | quote }}
{{- end }}
