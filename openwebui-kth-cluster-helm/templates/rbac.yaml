{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openwebui-kth-cluster-helm.serviceAccountName" . }}
  namespace: {{ include "openwebui-kth-cluster-helm.namespace" . }}
  labels:
    {{- include "openwebui-kth-cluster-helm.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resourceNames: [{{ .Values.rbac.stateSecretName | quote }}]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openwebui-kth-cluster-helm.serviceAccountName" . }}
  namespace: {{ include "openwebui-kth-cluster-helm.namespace" . }}
  labels:
    {{- include "openwebui-kth-cluster-helm.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "openwebui-kth-cluster-helm.serviceAccountName" . }}
    namespace: {{ include "openwebui-kth-cluster-helm.namespace" . }}
roleRef:
  kind: Role
  name: {{ include "openwebui-kth-cluster-helm.serviceAccountName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
