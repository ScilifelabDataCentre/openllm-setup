apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openllm
  namespace: {{ .Values.namespace.name }}
spec:
  hostnames:
{{- range .Values.gateway.hosts }}
    - {{ .host | quote }}
{{- end }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: default
      namespace: gateway
      port: 443
  rules:
    - backendRefs:
      - name: "open-webui"
        port: 8080
