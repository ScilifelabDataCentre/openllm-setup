# -----------------------------------------------------------------------------
# Embedding API key Secret  (create this BEFORE the first ArgoCD sync)
# -----------------------------------------------------------------------------
# The chart deliberately does NOT create this, to keep the key out of Git.
#
# 1. Generate a key:           openssl rand -hex 32
# 2. Put it below.
# 3. Apply it:                 kubectl -n llm-embeddings apply -f secret.example.yaml
#
# For production, do NOT commit a real key. Use a SealedSecret (the same
# direction flagged for the Open WebUI chart) so the encrypted form is safe in Git.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: embeddings-api-key
  namespace: llm-embeddings
type: Opaque
stringData:
  # This is the VLLM_API_KEY clients (Open WebUI's RAG) must send as Bearer.
  api-key: "replace-with-a-long-random-secret"
