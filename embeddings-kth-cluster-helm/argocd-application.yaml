# -----------------------------------------------------------------------------
# ArgoCD Application for the embedding backend.
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openllm-embeddings
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ScilifelabDataCentre/openllm-setup
    # The embedding chart now lives inside openllm-setup.
    targetRevision: main
    path: embeddings-kth-cluster-helm
    helm:
      valueFiles:
        - values.yaml
      # Per-environment overrides can also go here instead of editing
      # values.yaml. The GPU values below are already set in values.yaml;
      # shown here only as the override pattern:
      # values: |
      #   gpu:
      #     nodeSelector:
      #       nvidia.com/gpu.product: NVIDIA-A40-48C
      #     tolerations:
      #       - key: "nvidia.com/gpu"
      #         operator: "Exists"
      #         effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-embeddings
  syncPolicy:
    # No `automated:` block => manual sync, same as other two apps.
    syncOptions:
      - CreateNamespace=true
