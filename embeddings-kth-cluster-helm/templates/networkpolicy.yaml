{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "embeddings.fullname" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "embeddings.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "embeddings.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowedNamespace | quote }}
          {{- with .Values.networkPolicy.allowedPodLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- end -}}
