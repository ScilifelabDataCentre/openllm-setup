# ---------------------------------------------------------------------------
# Override values for the scilifelab-2-dev cluster (dev-2).
# Layered on top of the chart's values.yaml, which stays as the shared default.
#
#   helm install embeddings ./embeddings-kth-cluster-helm -n openllm \
#     -f ./embeddings-kth-cluster-helm/values-dev2.yaml
#
# (or referenced from the ArgoCD app's helm.valueFiles)
# ---------------------------------------------------------------------------

# openllm already exists on dev-2 (owned by the Open WebUI app): do NOT recreate.
namespace:
  create: false
  name: openllm

networkPolicy:
  # Open WebUI runs in the same namespace on dev-2.
  allowedNamespace: openllm
  # Only needed when the ingress below is enabled, so the nginx controller
  # (kube-system on RKE2) can reach the pod. Uncomment it together with ingress.
  # ingressControllerNamespace: kube-system

gpu:
  # dev-2 GPU nodes advertise this product label, DIFFERENT from dev-1's
  # NVIDIA-A40-48C. Each node is one A40 vGPU with a 16 GB profile (16C),
  # time-sliced into 8 schedulable nvidia.com/gpu units ("-SHARED"). A pod
  # requesting 1 GPU shares the 16 GB card with up to 7 others, with no
  # per-slice memory limit. Four such nodes (32 slots), so scheduling is easy.
  nodeSelector:
    nvidia.com/gpu.product: NVIDIA-A40-16C-SHARED
  # Taint confirmed on dev-2: nvidia.com/gpu:NoSchedule.
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"

model:
  # The card is 16 GB (not 48 GB) and shared, so reserve modestly.
  # 0.30 * 16 GB ~ 4.8 GB is plenty for BGE-M3 (~1-2 GB) and leaves room for
  # other tenants on the same GPU. max-model-len 8192 from values.yaml is fine.
  gpuMemoryUtilization: "0.30"

# ---------------------------------------------------------------------------
# Ingress (DISABLED) - was the "prod borrows dev-2 over an external URL" idea.
# ---------------------------------------------------------------------------
# On hold, and note two points from platform review:
#   1. Host scheme is <name>.scilifelab-2-dev.sys.kth.se.
#   2. dev-2 has NO ingress controller; it uses the Gateway API. So this Ingress
#      resource will NOT route here at all - it would need to be a Gateway API
#      HTTPRoute instead. (This also explains Open WebUI's stuck cert: an
#      Ingress-based ACME HTTP-01 solver has nothing to serve it.)
# Since the direction is now "add a GPU to prod-2" rather than a cross-cluster
# bridge, this stays disabled. If the bridge is ever revived, convert this to an
# HTTPRoute (needs the Gateway name/namespace/listener) and handle TLS via the
# platform's method for internal names, not public letsencrypt-prod.
ingress:
  enabled: false
  className: nginx
  host: embeddings.scilifelab-2-dev.sys.kth.se
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: embeddings-dev2-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    # SECURITY (if enabled): restrict who can reach it, e.g. to prod's egress CIDR:
    # nginx.ingress.kubernetes.io/whitelist-source-range: "PROD_EGRESS_IP/32"