# /mimer/NOBACKUP/sll_dc/multinode/conf/qwen3-235b.conf
#
# One file per multi-node deployment. Lives on Mimer so that every node reads the
# same copy; do not put it in a home directory, those are per-machine.
# Started with:  systemctl --user start vllm-multinode@qwen3-235b   (on EVERY node)
#
# Variable names follow the single-node runbook convention wherever the meaning is
# the same (PODMAN_IMAGE, VLLM_PORT, HF_MODEL, MODEL_NAME, VLLM_NGPUS, VLLM_ARGS).
# The MULTINODE_* names are the only new ones.

# --- image ------------------------------------------------------------------
# Not the stock vllm-openai image: this one has Ray baked in. Build it with the
# Containerfile next to this directory, and make sure every node has it loaded.
PODMAN_IMAGE=localhost/vllm-ray:0.24.0-ray2.57.0

# --- the cluster ------------------------------------------------------------
# InfiniBand addresses, space separated. THE FIRST ONE IS THE HEAD; it is the node
# that serves HTTP. Adding a node to this line is the whole of "add a node":
# node count, total GPUs and pipeline depth are all derived from it.
#   10.52.30.121 = sll-m11-41
#   10.52.30.122 = sll-m11-42
# Confirm any other node's address with `hostname -I` on it and take the 10.52 one.
MULTINODE_NODES="10.52.xx.xxx 10.52.xx.xxx"

MULTINODE_IB_PREFIX=10.52.      # how each node recognises its own IB address
MULTINODE_IB_IFNAME=ibs1        # IB interface name, same on all nodes
RAY_PORT=6379
RAY_CPUS=16                     # Ray prestarts idle workers in proportion to this
CLUSTER_WAIT_SECS=900           # head gives up if the cluster is incomplete

# --- the model --------------------------------------------------------------
# Full path to the downloaded snapshot on Mimer, never a HuggingFace short name. make sure the id is correct
HF_MODEL=/mimer/NOBACKUP/sll_dc/huggingface/hub/models--Qwen--Qwen3-235B-A22B-Instruct-2507/snapshots/<id>/

# Must match the model_name used in litellm.yaml.
MODEL_NAME="Qwen3-235B-A22B"

VLLM_NGPUS=4                    # GPUs per node; also the tensor parallel width
VLLM_PORT=8000                  # binds on the HEAD node only
GPU_MEM_UTIL=0.90
MAX_MODEL_LEN=32768

# VLLM_TP and VLLM_PP are derived by default: TP = VLLM_NGPUS, PP = node count.
# Uncomment only for a deliberate experiment.
# VLLM_TP=4
# VLLM_PP=2

# Extra vllm serve flags, space separated.
#   --enforce-eager was needed for first bring-up only. Removing it costs a few
#   minutes of startup and buys real throughput; do that once this deployment has
#   been stable for a few days. See the runbook, follow-ups.
VLLM_ARGS="--no-async-scheduling --enforce-eager"

# --- transport --------------------------------------------------------------
# 0 = cross-node NCCL over TCP on the IB fabric. WORKAROUND for memlock being
#     capped at 8 MB for llm, which makes RDMA registration fail.
# 1 = RDMA. Only after Chalmers raises memlock to unlimited and loads
#     nvidia-peermem on every node in MULTINODE_NODES.
USE_RDMA=0
NCCL_IB_HCA=mlx5_0              # used only when USE_RDMA=1. mlx5_0 is IB, mlx5_1 is RoCE.

# WARN in normal operation. INFO only while debugging transport, and expect a very
# large log volume from every rank.
NCCL_DEBUG=WARN

SHM_SIZE=32g
