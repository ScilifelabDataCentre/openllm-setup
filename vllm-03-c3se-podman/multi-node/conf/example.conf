# conf/example.conf
# Template for a new multi-node deployment. Copy to conf/<name>.conf, fill in, commit.
# Start on EVERY node listed: systemctl --user start vllm-multinode@<name>
#
# Before anything else, check the node allocation table in the root README. Every node
# you list here must be free of single-node vllm@ models, because a multi-node
# deployment claims all four GPUs on each node it uses.

# --- image ------------------------------------------------------------------
# Must be the Ray-enabled image, not the stock vllm-openai one. Build with the
# Containerfile in this directory and load it on every node in MULTINODE_NODES.
PODMAN_IMAGE=localhost/vllm-ray:0.24.0-ray2.57.0

# --- the cluster ------------------------------------------------------------
# InfiniBand addresses, space separated. THE FIRST ONE IS THE HEAD: it serves HTTP
# and it is the address that goes in proxy/litellm.yaml. Append, never reorder.
# Get each address with `hostname -I` on that node and take the 10.52 value.
#
# How many nodes do you need? Each node is 320 GB of GPU memory. Weights are about
# 2 bytes per parameter at BF16 and 0.5 at INT4, and you want headroom for the KV
# cache on top. Two nodes hold roughly 470 GB of weights comfortably. Use the fewest
# nodes that fit: pipeline depth adds latency, so a model that fits in two nodes runs
# slower on four.
MULTINODE_NODES="10.52.30.121 10.52.30.122"

MULTINODE_IB_PREFIX=10.52.
MULTINODE_IB_IFNAME=ibs1
RAY_PORT=6379                   # unique per deployment if two ever run at once
RAY_CPUS=16
CLUSTER_WAIT_SECS=900

# --- the model --------------------------------------------------------------
# Full snapshot path on Mimer. Download first; see the root README.
HF_MODEL=/mimer/NOBACKUP/sll_dc/huggingface/hub/models--ORG--MODEL/snapshots/SNAPSHOT_ID/

# The API-facing name. Must match model_name and the hosted_vllm/ string in
# proxy/litellm.yaml exactly, or LiteLLM returns a 404.
MODEL_NAME="REPLACE_ME"

VLLM_NGPUS=4                    # GPUs per node, and the tensor parallel width
VLLM_PORT=8000                  # binds on the head node only
GPU_MEM_UTIL=0.93
MAX_MODEL_LEN=131072

# TP and PP are derived: TP = VLLM_NGPUS, PP = number of nodes. Override only
# deliberately. Note that PP splits by layer, so it divides most cleanly when the
# layer count divides by the node count. Check with:
#   python3 -c "import json;print(json.load(open('<HF_MODEL>/config.json'))['num_hidden_layers'])"
# VLLM_TP=4
# VLLM_PP=2

# Start with --enforce-eager for the first bring-up: it removes torch.compile and
# CUDA graph capture, which otherwise look like a hang for a long time. Remove it
# once the deployment serves cleanly.
#
# If anything will call this model through Open WebUI or with tools, you also need
# --enable-auto-tool-choice together with --tool-call-parser <parser>. Open WebUI
# sends tool_choice:"auto" on every chat, and without both flags vLLM returns a 400
# on the very first message. Pick the parser for the model family: hermes for Qwen3,
# gemma4 for Gemma. Check what this build supports:
#   vllm serve --help | grep -A5 tool-call-parser
# Add --reasoning-parser <parser> only for models that actually emit thinking blocks.
VLLM_ARGS="--enforce-eager"

# --- transport --------------------------------------------------------------
# 1 = RDMA, 0 = TCP over the IB fabric.
#
# Default 0 deliberately: this is the path proven to serve. RDMA became possible on
# 2026-08-14 when C3SE raised the memlock limit, but it has not yet been confirmed in
# a serving run. A first bring-up is the worst moment to also be debugging transport,
# because an RDMA failure looks like every other kind of distributed hang.
#
# Flip to 1 once the qwen3-235b deployment has proven RDMA works, then check the log
# for NET/IB and for zero ibv_reg_mr errors. See "Transport status" in the README.
USE_RDMA=0
NCCL_IB_HCA=mlx5_0              # used only when USE_RDMA=1
# NCCL_NET_GDR_LEVEL=PHB

# Set to 1 to allow this deployment to share a node with another vLLM container. The
# launcher otherwise refuses to start. Only for a deliberate experiment.
# ALLOW_SHARED_NODE=0

NCCL_DEBUG=WARN
SHM_SIZE=32g
