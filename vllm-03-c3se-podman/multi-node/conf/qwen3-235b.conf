# conf/qwen3-235b.conf
# Qwen3-235B-A22B-Instruct-2507, BF16, across sll-m11-41 (head) and sll-m11-42.
# Start on EVERY node: systemctl --user start vllm-multinode@qwen3-235b
#
# Read straight from the checkout on Mimer by every node, so there is one copy.
# Variable names follow the single-node convention wherever the meaning is the same
# (PODMAN_IMAGE, VLLM_PORT, HF_MODEL, MODEL_NAME, VLLM_NGPUS, VLLM_ARGS). The
# MULTINODE_* names are the only new ones.

# --- image ------------------------------------------------------------------
# Not the stock vllm-openai image: this one has Ray baked in. Build it with the
# Containerfile in this directory and load it on every node listed below.
PODMAN_IMAGE=localhost/vllm-ray:0.24.0-ray2.57.0

# --- the cluster ------------------------------------------------------------
# InfiniBand addresses, space separated. THE FIRST ONE IS THE HEAD; it is the node
# that serves HTTP and the address that goes in litellm.yaml. Adding a node to this
# line is the whole of "add a node": node count, total GPUs and pipeline depth are
# all derived from it. Append, never reorder.
#   10.52.30.121 = sll-m11-41
#   10.52.30.122 = sll-m11-42
# Confirm any other node's address with `hostname -I` on it and take the 10.52 value.
MULTINODE_NODES="10.52.30.121 10.52.30.122"

MULTINODE_IB_PREFIX=10.52.      # how each node recognises its own IB address
MULTINODE_IB_IFNAME=ibs1        # IB interface name, same on all nodes
RAY_PORT=6379
RAY_CPUS=16                     # Ray prestarts idle workers in proportion to this
CLUSTER_WAIT_SECS=900           # head gives up if the cluster is still incomplete

# --- the model --------------------------------------------------------------
# Full path to the downloaded snapshot on Mimer, never a HuggingFace short name.
HF_MODEL=/mimer/NOBACKUP/sll_dc/huggingface/hub/models--Qwen--Qwen3-235B-A22B-Instruct-2507/snapshots/ac9c66cc9b46af7306746a9250f23d47083d689e/

# Must match model_name and the string after hosted_vllm/ in proxy/litellm.yaml.
MODEL_NAME="Qwen3-235B-A22B"

VLLM_NGPUS=4                    # GPUs per node; also the tensor parallel width
VLLM_PORT=8000                  # binds on the HEAD node only
GPU_MEM_UTIL=0.93
MAX_MODEL_LEN=131072

# VLLM_TP and VLLM_PP are derived by default: TP = VLLM_NGPUS, PP = node count.
# Uncomment only for a deliberate experiment.
# VLLM_TP=4
# VLLM_PP=2

# Extra vllm serve flags, space separated.
#
#   --enable-auto-tool-choice and --tool-call-parser are required together, or vLLM
#   rejects any request carrying tool_choice:"auto" with a 400:
#     '"auto" tool choice requires --enable-auto-tool-choice and --tool-call-parser'
#   Open WebUI sends that on every chat, so without these the model 400s on hello.
#   Qwen3 emits Hermes-style <tool_call> blocks, hence the hermes parser. Confirm the
#   build offers it: vllm serve --help | grep -A5 tool-call-parser
#
#   No --reasoning-parser here on purpose. The Instruct-2507 variant is non-thinking
#   and emits no <think> blocks, unlike the base Qwen3-235B-A22B.
#
#   --enforce-eager was needed for first bring-up only, to keep torch.compile and 51
#   CUDA graph captures out of the picture while debugging. Removing it costs a few
#   minutes of startup and buys real throughput. Do that as a separate change, and
#   measure before and after, rather than bundling it with anything else.
VLLM_ARGS="--no-async-scheduling --enforce-eager --enable-auto-tool-choice --tool-call-parser hermes"
 

# --- transport --------------------------------------------------------------
# 0 = cross-node NCCL over TCP on the IB fabric.
# 1 = RDMA.
#
# STATUS 2026-08-14: the blocker is gone. memlock for llm was capped at 8 MB, which
# made RDMA memory registration fail; Chalmers raised it to 1 TiB and the container
# now reports "unlimited". USE_RDMA=1 is expected to work and has not yet been
# verified in a serving run, which is why this still reads 0.
#
# To flip: set 1, restart on every node, then confirm in the log that NCCL reports
# NET/IB with mlx5_0 and that `grep -c ibv_reg_mr` is zero. Expect a few percent on
# generation and around ten percent on long-prompt time to first token; the gain
# grows with pipeline depth. Confluence has the measurement walkthrough.
USE_RDMA=1
NCCL_IB_HCA=mlx5_0              # used only when USE_RDMA=1. mlx5_0 is IB, mlx5_1 is RoCE.

# Optional, only when USE_RDMA=1. Controls how far apart a GPU and the NIC may be for
# GPUDirect. Unset lets NCCL choose, which is usually right. On these nodes GPU2 and
# GPU3 are SYS from the NICs, so PHB is the sensible manual setting if you want
# GPUDirect for the near GPUs only.
# NCCL_NET_GDR_LEVEL=PHB

# WARN in normal operation. INFO only while debugging transport, and expect a very
# large log volume from every rank.
NCCL_DEBUG=WARN

SHM_SIZE=32g
