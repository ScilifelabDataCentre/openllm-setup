# conf/mistral-large-3.conf
# Mistral-Large-3-675B-Instruct-2512-NVFP4 across sll-m11-39 (head) and sll-m11-40.

# --- image ------------------------------------------------------------------
PODMAN_IMAGE=localhost/vllm-ray:0.24.0-ray2.57.0

# --- the cluster ------------------------------------------------------------
# FIRST IS THE HEAD, and the head address is what goes in proxy/litellm.yaml.
# NEVER reorder.
#   10.52.30.119 = sll-m11-39   (head, serves :8000)
#   10.52.30.120 = sll-m11-40   (worker)
MULTINODE_NODES="10.52.30.119 10.52.30.120"

MULTINODE_IB_PREFIX=10.52.
MULTINODE_IB_IFNAME=ibs1
RAY_PORT=6379                   # no clash with 41+42: --net host, different machines
RAY_CPUS=16
CLUSTER_WAIT_SECS=900

# --- the model --------------------------------------------------------------
# 403 GB on disk, 273 shards named consolidated-*.safetensors (mistral format, not the usual model-*.safetensors).
HF_MODEL=/mimer/NOBACKUP/sll_dc/huggingface/hub/models--mistralai--Mistral-Large-3-675B-Instruct-2512-NVFP4/snapshots/6f01426c721bd365f29a108f2389782e9671aab2

# Must match model_name and the string after hosted_vllm/ in proxy/litellm.yaml.
MODEL_NAME="Mistral-Large-3-675B-Instruct-2512-NVFP4"

VLLM_NGPUS=4                    # GPUs per node, and the tensor parallel width
VLLM_PORT=8000                  # binds on the head node only

# 403 GB of weights into 8 x 80 GB. 0.90 leaves roughly 170 GB for KV cache and
# activations, and gives the FP4 Marlin repack that runs during load somewhere to
# breathe. Raise toward 0.93 only after a clean bring-up.
GPU_MEM_UTIL=0.90

# The checkpoint defaults to 262144. Mistral report a quality regression above 64k
# on the NVFP4 weights and point at the FP8 checkpoint instead
MAX_MODEL_LEN=65536

# VLLM_TP and VLLM_PP are derived by default: TP = VLLM_NGPUS, PP = node count.
# Uncomment only for a deliberate experiment.
# VLLM_TP=4
# VLLM_PP=2

# --- vllm serve flags -------------------------------------------------------
#
#   The three mistral flags are not optional. The repo ships params.json and
#   consolidated-*.safetensors; without them vLLM cannot read the checkpoint.
#
#   --enable-auto-tool-choice and --tool-call-parser mistral together, as always,
#   because Open WebUI sends tool_choice:"auto" on every chat. The mistral parser
#   is in this build: vllm/tool_parsers/mistral_tool_parser.py, registered as
#   "mistral".
#
#   No --reasoning-parser. Mistral state plainly that this is not a reasoning
#   model, and it emits no thinking blocks.
#
#   --enforce-eager for first bring-up only.
VLLM_ARGS="--enforce-eager --tokenizer_mode mistral --config_format mistral --load_format mistral --enable-auto-tool-choice --tool-call-parser mistral"

# --- transport --------------------------------------------------------------
USE_RDMA=1
NCCL_IB_HCA=mlx5_0
# NCCL_NET_GDR_LEVEL=PHB

NCCL_DEBUG=INFO
NCCL_DEBUG_SUBSYS=INIT,NET
SHM_SIZE=32g
