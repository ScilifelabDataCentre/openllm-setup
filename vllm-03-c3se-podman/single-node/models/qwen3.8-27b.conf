# Path on host: ~/vllm/qwen3.8-27b.conf
# Start: systemctl --user start vllm@qwen3.8-27b
PODMAN_IMAGE=docker.io/vllm/vllm-openai:v0.24.0
VLLM_PORT=8000
HF_MODEL=/mimer/NOBACKUP/sll_dc/huggingface/hub/models--Qwen--Qwen3.8-27B/snapshots/1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
MODEL_NAME="Qwen/Qwen3.8-27B"
VLLM_NGPUS=4
# 28B BF16 is ~56 GB of 288 GB usable. Only 16 of 64 layers use full attention,
# the rest are Gated DeltaNet, so per-token KV is small and 262144 is reachable.
# Start at 32768 and raise once it serves.
#
# tool-call-parser is qwen3_xml, NOT hermes: this model's template emits
# <function=name><parameter=key> inside <tool_call>, unlike Qwen3-235B-Instruct.
# Thinking is on by default, so the reasoning parser is required.
VLLM_ARGS="--no-use-tqdm-on-load \
--gpu-memory-utilization 0.90 \
--max-model-len 262144 \
--enable-auto-tool-choice \
--tool-call-parser qwen3_xml \
--reasoning-parser qwen3 \
--limit-mm-per-prompt.image=4 \
--limit-mm-per-prompt.video=1"