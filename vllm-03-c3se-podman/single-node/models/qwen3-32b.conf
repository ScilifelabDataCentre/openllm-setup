# Path on host: ~/vllm/qwen3-32b.conf  (on the compute node that runs it)
# Start: systemctl --user start vllm@qwen3-32b
# NOTE: HF_MODEL is the full snapshot path AFTER downloading. Get it with:
#   ls -d /mimer/NOBACKUP/sll_dc/huggingface/hub/models--Qwen--Qwen3-32B/snapshots/*/
PODMAN_IMAGE=docker.io/vllm/vllm-openai:v0.24.0
VLLM_PORT=8000
HF_MODEL=/mimer/NOBACKUP/sll_dc/huggingface/hub/models--Qwen--Qwen3-32B/snapshots/9216db5781bf21249d130ec9da846c4624c16137/
MODEL_NAME="Qwen/Qwen3-32B"
VLLM_NGPUS=4
# --enable-auto-tool-choice and --tool-call-parser are required together. Open WebUI
# sends tool_choice:"auto" on every chat, so without both, vLLM returns a 400 on the
# very first message. Qwen3 instruct models emit JSON inside <tool_call> tags, which
# is the Hermes format, confirmed against this model's chat_template.
#
# Qwen3-32B has thinking mode, unlike Qwen3-235B-A22B-Instruct-2507, so it also wants
# a reasoning parser. Verify the model actually emits <think> blocks before trusting
# this; drop the flag if it does not.
VLLM_ARGS="--gpu-memory-utilization 0.90 --max-model-len 32768 \
--enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3"
