# Example model conf, read by vllm@.service as EnvironmentFile.
# Path on host: ~/vllm/gemma4.conf  (on the compute node that runs it)
# Start: systemctl --user start vllm@gemma4
PODMAN_IMAGE=docker.io/vllm/vllm-openai:v0.24.0
VLLM_PORT=8000
HF_MODEL=/mimer/NOBACKUP/sll_dc/huggingface/hub/models--google--gemma-4-E2B-it/snapshots/9dbdf8a839e4e9e0eb56ed80cc8886661d3817cf/
MODEL_NAME="google/gemma-4-E2B-it"
VLLM_NGPUS=4
VLLM_ARGS="--no-use-tqdm-on-load \
--gpu-memory-utilization 0.4 \
--enable-auto-tool-choice \
--reasoning-parser gemma4 \
--tool-call-parser gemma4 \
--limit-mm-per-prompt.image=4 \
--limit-mm-per-prompt.audio=1 \
--async-scheduling"
