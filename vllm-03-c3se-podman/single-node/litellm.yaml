# LiteLLM proxy config. Path on host: ~/litellm/litellm.yaml  (login node)
# Secrets come from ~/litellm.env via os.environ.
model_list:
  - model_name: google/gemma-4-E2B-it
    litellm_params:
      model: hosted_vllm/google/gemma-4-E2B-it   # hosted_vllm/ routes as an OpenAI-compatible vLLM backend
      api_base: http://sll-m11-38:8000/v1
  - model_name: Qwen/Qwen3-32B
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3-32B
      api_base: http://sll-m11-39:8000/v1

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
