apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy-openllm-logs
  namespace: loki-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy-openllm-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy-openllm-logs
    spec:
      containers:
      - args:
          - run
          - /etc/alloy/config.alloy
          - --server.http.listen-addr=0.0.0.0:12345
        envFrom:
          - secretRef:
              name: alloy-token-s2p
        image: docker.io/grafana/alloy:v1.17.0
        imagePullPolicy: IfNotPresent
        name: alloy
        ports:
        - containerPort: 12345
          name: http-metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /-/ready
            port: 12345
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          requests:
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/alloy
          name: config
      volumes:
      - configMap:
          defaultMode: 420
          name: alloy-config
        name: config
