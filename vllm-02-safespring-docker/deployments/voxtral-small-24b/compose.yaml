# deployments/voxtral-small-24b/compose.yaml
services:
  voxtral-small-24b:
    build:
      context: .
      dockerfile: Dockerfile
    image: vllm-voxtral:latest
    container_name: voxtral-small-24b
    env_file:
      - ../.env                     # shared env values
    volumes:
      - ${HF_CACHE_DIR:-/data/vllm_models}:/root/.cache/huggingface   # shared HF cache
      - ./vllm-config.yaml:/app/vllm-config.yaml:ro
    ports:
      - "${VOXTRAL_PORT:-8001}:8000"
    command: ["--config", "/app/vllm-config.yaml"]
    ipc: host                       # vLLM needs shared memory for TP
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VOXTRAL_GPU:-1}"]   # default: GPU 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - vllm-net

# Attach to the same external network as other models
networks:
  vllm-net:
    external: true