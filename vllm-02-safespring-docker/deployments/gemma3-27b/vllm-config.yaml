# deployments/gemma3-27b/vllm-config.yaml

# --- Model ---
model: google/gemma-3-27b-it
# Alias clients (and Open WebUI) use as the model name in requests
served_model_name: gemma3-27b

dtype: bfloat16

# --- Parallelism / devices ---
# Single H100 (80GB) fits bf16 weights (~55GB) + KV cache comfortably.
# tp=2 only needed for more KV cache headroom for higher concurrency/context.
tensor_parallel_size: 1
# The remaining non-vLLM memory needs should not exceed 7% of GPU memory.
gpu_memory_utilization: 0.93

# --- Context ---
# Lower this if we hit OOM during CUDA graph capture.
max_model_len: 32768

# Tool calling, (Gemma 3 has no native tool format);
enable_auto_tool_choice: true
tool_call_parser: pythonic
# If adding a tool-aware chat template:
# chat_template: /app/templates/gemma3_tool.jinja

# --- Server ---
host: "0.0.0.0"
port: 8000
