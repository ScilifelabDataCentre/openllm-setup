services:
  vllm:
    # Deployment/environment settings live in Compose + .env:
    # - published host port
    # - mounted host paths
    # - secrets/tokens
    # - selected model / served model name
    #
    # Application-internal server settings live in vllm-config.yaml:
    # - host/port inside the container
    # - runtime tuning
    # - server behavior

    image: vllm/vllm-openai:${VLLM_IMAGE_TAG}
    container_name: ${CONTAINER_NAME}
    ports:
      - "${VLLM_HOST_PORT}:8000"
    ipc: host
    volumes:
      - ${HF_CACHE_DIR}:/root/.cache/huggingface
      - ./vllm-config.yaml:/workspace/vllm-config.yaml:ro
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_API_KEY: ${VLLM_API_KEY}
    command: >
      --config /workspace/vllm-config.yaml
      --model ${VLLM_MODEL}
      --served-model-name ${SERVED_MODEL_NAME}
      --enable-auto-tool-choice
      --tool-call-parser pythonic
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
